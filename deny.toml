# cargo-deny configuration. Checked in CI by .github/workflows/rust.yml.
#
# Run locally with:  cargo deny check

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93

# Permissive licenses only. This project is MIT OR Apache-2.0, and a
# copyleft dependency would force a relicense.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Two versions of a crate are common in a wgpu/winit tree and not worth
# blocking a merge over; wildcard version requirements are.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
